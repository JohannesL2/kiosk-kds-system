services:
  kiosk-app:
    build: .
    ports:
      - "5173:5173"
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://kiosk:local_dev_only@db:5432/kiosk
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiosk
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: local_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosk -d kiosk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: